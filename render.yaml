services:
  - type: web
    name: updates-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
